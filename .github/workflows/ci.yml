name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc needs @prisma/client's generated types, but not a live database —
      # `generate` reads only schema.prisma.
      - run: npx prisma generate

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm test
